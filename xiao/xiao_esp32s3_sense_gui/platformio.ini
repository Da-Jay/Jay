; Windows 路徑長度上限 (260 字元) 會讓 ESP32 函式庫解壓失敗, 因此把套件與編譯目錄改到短路徑
[platformio]
core_dir = C:/p
build_dir = C:/pio_build/xiao_esp32s3_sense

; XIAO ESP32-S3 Sense (OV2640 鏡頭) — 使用 pioarduino 平台 (Arduino-ESP32 3.3+)
[env:xiao_esp32s3_sense]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_port = COM16
monitor_port = COM16
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
