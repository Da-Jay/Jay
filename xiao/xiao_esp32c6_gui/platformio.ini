; Windows 路徑長度上限 (260 字元) 會讓 ESP32 函式庫解壓失敗, 因此把套件與編譯目錄改到短路徑
[platformio]
core_dir = C:/p
build_dir = C:/pio_build/xiao_esp32c6

; XIAO ESP32-C6 — 需要 pioarduino 平台 (Arduino-ESP32 3.3+), 官方 espressif32 平台尚不支援 C6
[env:xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
upload_port = COM14
monitor_port = COM14
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
